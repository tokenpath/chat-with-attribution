<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="32" height="64" fill="#2f2650"/>
  <rect x="32" width="32" height="64" fill="#456643"/>
  <!--
    A lowercase "tp" outlined as beziers, so the mark renders identically with
    no font installed.

    Metrics on the 64-unit grid: t ascender 8, x-height line 20, baseline 44,
    descender 56 — an ink box of 8..56, centred on the canvas. Stems are 8
    wide and sit on x=12 and x=36 so that at 16px (four units to the pixel)
    every stem, the field split and the top and bottom terminals land on whole
    pixels instead of dissolving into grey.

    The split sits at 32, in the whitespace between the t's tail terminal (29)
    and the p's stem (36), so it never cuts a glyph.
  -->
  <g fill="#ffffff">
    <!-- t crossbar -->
    <path d="M4 20h22v7H4z"/>
    <!-- t stem, bending into its tail at the baseline -->
    <path d="M12 8L20 8L20 34.6C20 36.1 20.7 37 21.8 37L29 37L29 44L22.4 44C16.4 44 12 40.6 12 35Z"/>
    <!-- p stem and bowl; the counter sits flat against the stem, and the
         bowl's side is a touch heavier than its top and bottom -->
    <path
      fill-rule="evenodd"
      d="M36 20L44 20C52.84 20 60 25.37 60 32C60 38.63 52.84 44 44 44L44 56L36 56ZM44 26C48.97 26 53 28.69 53 32C53 35.31 48.97 38 44 38Z"
    />
  </g>
</svg>
