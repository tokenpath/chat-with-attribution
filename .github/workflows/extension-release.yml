name: Extension package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      live_sites:
        description: Also run the diagnostic live third-party site checks
        type: boolean
        default: false

concurrency:
  group: extension-${{ github.ref }}-${{ github.event_name == 'schedule' && 'live' || 'ci' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tldr-extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tldr-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: |
          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Verify release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          test "$RELEASE_TAG" = "v$MANIFEST_VERSION"

      - name: Run complete test suite
        env:
          E2E_LIVE_SITES: ${{ inputs.live_sites && '1' || '' }}
        run: npm test

      - name: Verify committed side-panel bundle is up to date
        working-directory: .
        run: git diff --exit-code -- tldr-extension/sidepanel

      - name: Regenerate the third-party license notice
        run: npm run licenses

      - name: Verify committed third-party license notice is up to date
        working-directory: .
        run: git diff --exit-code -- THIRD-PARTY-LICENSES.md

      - name: Build Chrome Web Store package
        run: npm run package:store:ci

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: tokenpath-extension-${{ github.run_id }}
          path: tldr-extension/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  live-sites:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tldr-extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tldr-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: |
          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the browser suite against live sites
        env:
          E2E_LIVE_SITES: "1"
        run: npm run test:e2e

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested package
        uses: actions/download-artifact@v7
        with:
          name: tokenpath-extension-${{ github.run_id }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip
          --repo "$GITHUB_REPOSITORY"
          --title "Browse with TokenPath $RELEASE_TAG"
          --generate-notes
