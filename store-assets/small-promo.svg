    <text x="13" y="17" font-family="Menlo, Consolas, monospace" font-size="8" fill="#777382">ANSWER</text>
    <rect x="13" y="25" width="138" height="6" rx="3" fill="#393645"/>
    <rect x="13" y="37" width="60" height="10" rx="2" fill="#456643"/>
    <rect x="79" y="39" width="58" height="6" rx="3" fill="#393645"/>
  </g>

  <path d="M 198 212 C 214 212, 226 229.5, 242 229.5" fill="none" stroke="url(#path)" stroke-width="2"/>
