<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7cc9"/>
      <stop offset="1" stop-color="#8fbe8b"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" fill="#131217"/>
  <rect width="440" height="280" fill="url(#grid)"/>
  <rect x="0" y="0" width="5" height="280" fill="#2f2650"/>
  <rect x="435" y="0" width="5" height="280" fill="#456643"/>

  <g transform="translate(28 26)">
    <rect width="28" height="56" fill="#2f2650"/>
    <rect x="28" width="28" height="56" fill="#456643"/>
    <text x="15" y="40" font-family="Menlo, Consolas, monospace" font-size="33" fill="#fff" text-anchor="middle">t</text>
    <text x="41" y="40" font-family="Menlo, Consolas, monospace" font-size="33" fill="#fff" text-anchor="middle">p</text>
  </g>

  <text x="28" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="650" fill="#f2f1f5">Chat with</text>
  <text x="28" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="650" fill="#f2f1f5">attribution.</text>
  <rect x="27" y="162" width="171" height="3" fill="url(#path)"/>

  <text x="28" y="198" font-family="Menlo, Consolas, monospace" font-size="11" fill="#a09daa">SELECT ANY ANSWER TEXT</text>
  <text x="28" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#cfccd6">See the exact source behind it.</text>

  <g transform="translate(253 41)">
    <rect width="156" height="83" rx="7" fill="#1d1b23" stroke="#393645"/>
    <text x="13" y="20" font-family="Menlo, Consolas, monospace" font-size="8" fill="#777382">ANSWER</text>
    <rect x="13" y="33" width="126" height="6" rx="3" fill="#393645"/>
    <rect x="13" y="49" width="57" height="13" rx="2" fill="#456643"/>
    <rect x="74" y="52" width="62" height="6" rx="3" fill="#393645"/>
  </g>

  <path d="M 325 109 C 325 137, 337 144, 337 164" fill="none" stroke="url(#path)" stroke-width="2"/>
  <circle cx="325" cy="109" r="3" fill="#8a7cc9"/>
  <circle cx="337" cy="164" r="3" fill="#8fbe8b"/>

  <g transform="translate(253 164)">
    <rect width="156" height="75" rx="7" fill="#1d1b23" stroke="#456643"/>
    <text x="13" y="20" font-family="Menlo, Consolas, monospace" font-size="8" fill="#8fbe8b">EXACT SOURCE</text>
    <rect x="13" y="33" width="126" height="5" rx="2.5" fill="#393645"/>
    <rect x="13" y="47" width="35" height="9" rx="2" fill="#8fbe8b" fill-opacity=".8"/>
    <rect x="52" y="49" width="84" height="5" rx="2.5" fill="#393645"/>
  </g>

  <text x="28" y="258" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#8fbe8b">tokenpath.ai</text>
</svg>
