<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7cc9"/>
      <stop offset="1" stop-color="#8fbe8b"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" fill="#131217"/>
  <rect width="440" height="280" fill="url(#grid)"/>
  <rect x="0" y="0" width="5" height="280" fill="#2f2650"/>
  <rect x="435" y="0" width="5" height="280" fill="#456643"/>

  <!-- Use the packaged extension icon so the store tile stays in sync. -->
  <image href="../extension/icons/icon128.png" x="28" y="24" width="46" height="46"/>

  <text x="88" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="650" fill="#f2f1f5">Browse with TokenPath</text>
  <rect x="88" y="70" width="288" height="3" fill="url(#path)"/>

  <text x="28" y="106" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#a09daa">ANY PAGE, ANY PDF, ANY VIDEO</text>
  <text x="28" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#cfccd6">Chat with it, and trace every answer</text>
  <text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#cfccd6">back to its exact source.</text>

  <g transform="translate(28 170)">
    <rect width="170" height="52" rx="7" fill="#1d1b23" stroke="#393645"/>
    <text x="13" y="17" font-family="Menlo, Consolas, monospace" font-size="8" fill="#777382">ANSWER</text>
    <rect x="13" y="25" width="138" height="6" rx="3" fill="#393645"/>
    <rect x="13" y="37" width="60" height="10" rx="2" fill="#456643"/>
    <rect x="79" y="39" width="58" height="6" rx="3" fill="#393645"/>
  </g>

  <path d="M 198 212 C 214 212, 226 229.5, 242 229.5" fill="none" stroke="url(#path)" stroke-width="2"/>
  <circle cx="198" cy="212" r="3" fill="#8a7cc9"/>
  <circle cx="242" cy="229.5" r="3" fill="#8fbe8b"/>

  <g transform="translate(242 188)">
    <rect width="170" height="52" rx="7" fill="#1d1b23" stroke="#456643"/>
    <text x="13" y="17" font-family="Menlo, Consolas, monospace" font-size="8" fill="#8fbe8b">EXACT SOURCE</text>
    <rect x="13" y="25" width="138" height="5" rx="2.5" fill="#393645"/>
    <rect x="13" y="37" width="42" height="9" rx="2" fill="#8fbe8b" fill-opacity=".8"/>
    <rect x="60" y="39" width="91" height="5" rx="2.5" fill="#393645"/>
  </g>

  <text x="28" y="262" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#8fbe8b">tokenpath.ai</text>
</svg>
