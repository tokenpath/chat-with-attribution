  <text x="28" y="106" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#a09daa">ANY PAGE, ANY PDF, ANY VIDEO</text>
  <text x="28" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#cfccd6">Chat with it, and trace every answer</text>
  <text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#cfccd6">back to its exact source.</text>

  <g transform="translate(28 170)">
